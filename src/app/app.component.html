<div class="layout">
  <aside>
    <ul>
      <li *ngFor="let mode of modes" (click)="selectMode(mode)" [class.active]="activeMode?.label === mode.label">
        {{ mode.label }}
      </li>
    </ul>
  </aside>

  <main>
    <superTable *ngIf="activeMode" [config]="activeMode.config" [data]="activeMode.data">
    </superTable>
  </main>
</div>
